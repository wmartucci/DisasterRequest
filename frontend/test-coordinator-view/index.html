<!DOCTYPE html>
<head>
    <script type="module" src="https://js.arcgis.com/calcite-components/5.2"></script>
    <script type="module" src="https://js.arcgis.com/5.1"></script>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" type="module"></script>
</head>
<body>
    <calcite-shell>
        <calcite-navigation id="nav" slot="header">
            <calcite-navigation-logo slot="logo" icon="rain-thunder" heading="Disaster Response"></calcite-navigation-logo>
        </calcite-navigation>
        <div class="main-layout-grid">
            <div id="status-boxes">
                <div id="card-1">
                    <p class="inner-card">Test 1</p>
                    <p>Fires</p>
                </div>
                <div id="card-2">
                    <p class="inner-card">Test 1</p>
                    <p>Power Outages</p>
                </div>
                <div id="card-3">
                    <p class="inner-card">Test 1</p>
                    <p>Fallen Trees</p>
                </div>
                <div id="card-4">
                    <p class="inner-card">Test 1</p>
                    <p>Floods</p>
                </div>
            </div>
            <div id="district-toggle">
                <!-- <calcite-label><strong>Aggregation</strong> -->
                    <calcite-switch label-text-end="Status" label-text-start="Type"></calcite-switch>
                <!-- </calcite-label> -->
            </div>
            <calcite-panel id="map-panel" heading="Map" scale="s">
                <arcgis-map id="map" basemap="topo-vector" center="-82.54947363304201, 35.580068654542416" zoom=11>
                </arcgis-map>
            </calcite-panel>
            <arcgis-feature-table
                reference-element="#map" id="table"
            ></arcgis-feature-table>
        </div>
    </calcite-shell>
</body>
