<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Disaster Response</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>

<!--
  Entry point / role router.
  Each role has its own page; this one only works out who is signed in and
  forwards them. Responders and Volunteers stay here until their pages exist.
-->
<body>
  <main id="main" tabindex="-1">
    <p id="status" class="muted" role="status">Checking your account…</p>
    <p id="error" class="message error" role="alert" hidden></p>

    <section id="placeholder" class="panel" hidden>
      <p class="eyebrow">COMMUNITY RESPONSE HUB</p>
      <h2>Welcome, <span id="account-name"></span>.</h2>
      <p class="muted">
        The <strong id="account-role"></strong> page is coming soon.
      </p>
      <button id="logout" class="secondary-button">Log out</button>
    </section>

    <noscript>
      <p class="message error">Enable JavaScript to continue.</p>
    </noscript>
  </main>

  <script type="module">
    import { getCurrentUser, logout } from "/assets/api.js";

    // Keep in sync with ROLE_HOME in login.html.
    const ROLE_HOME = {
      "Community Member": "/community-member",
      "Response Coordinator": "/coordinator",
    };

    const $ = (selector) => document.querySelector(selector);

    $("#logout").addEventListener("click", async () => {
      try { await logout(); } catch { /* leave anyway */ }
      window.location.replace("/login");
    });

    try {
      const user = await getCurrentUser();
      if (!user) {
        window.location.replace("/login");
      } else if (ROLE_HOME[user.role]) {
        window.location.replace(ROLE_HOME[user.role]);
      } else {
        $("#account-name").textContent = `${user.first_name} ${user.last_name}`;
        $("#account-role").textContent = user.role ?? "requested";
        $("#status").hidden = true;
        $("#placeholder").hidden = false;
      }
    } catch (error) {
      if (error.status === 401 || error.status === 403) {
        window.location.replace("/login");
      } else {
        $("#status").hidden = true;
        $("#error").textContent = error.message;
        $("#error").hidden = false;
      }
    }
  </script>
</body>
</html>
